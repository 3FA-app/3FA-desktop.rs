name: Kick canonical interface pin

on:
  push:
    branches:
      - agent/den-277-pin-canonical-interfaces

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      INTERFACES_COMMIT: ef75da711138dfb96e4fe18a87f8d82efe997c0d
      GENERATED_EXPORT_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-e4d8-822f-9526-eca455690cc1/raw?se=2026-07-27T21:21:34Z&sp=r&sv=2026-02-06&sr=b&scid=758e6602-e856-5f8d-9d43-22d962c34a57&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-27T19:20:25Z&ske=2026-07-29T19:20:25Z&sks=b&skv=2026-02-06&sig=R0JWGi5U/yxZMhTmd5%2BXkPuIz751lB12vZ8jaSiRF3M%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/den-277-pin-canonical-interfaces
          fetch-depth: 0

      - name: Download validated generated package
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$GENERATED_EXPORT_URL" \
            --output "$RUNNER_TEMP/generated-export.zip"
          mkdir -p "$RUNNER_TEMP/export" "$RUNNER_TEMP/generated"
          unzip -q "$RUNNER_TEMP/generated-export.zip" -d "$RUNNER_TEMP/export"
          unzip -q "$RUNNER_TEMP/export/generated-interfaces.zip" -d "$RUNNER_TEMP/generated"
          test "$(cat "$RUNNER_TEMP/export/generated-source-commit.txt")" = "$INTERFACES_COMMIT"

      - name: Execute the reviewed composition block
        shell: python
        run: |
          import pathlib
          import textwrap

          workflow = pathlib.Path('.github/workflows/apply-interface-pin.yml').read_text()
          start_marker = '          import os\n'
          end_marker = '\n      - name: Format and validate the self-contained desktop consumer'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          block = textwrap.dedent(workflow[start:end])
          exec(compile(block, 'apply-interface-pin.yml', 'exec'))

      - name: Format and validate self-contained consumer
        run: |
          cargo fmt --all
          python3 scripts/check_vendored_interfaces.py
          cargo check --no-default-features
          cargo test --no-default-features

      - name: Remove temporary workflows and commit
        run: |
          rm .github/workflows/apply-interface-pin.yml .github/workflows/kick-interface-pin.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock README.md src tests vendor scripts docs VENDORED_INTERFACES.toml .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Pin desktop to canonical Signal interfaces"
          git push origin HEAD:agent/den-277-pin-canonical-interfaces
