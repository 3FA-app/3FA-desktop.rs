name: Apply coordinated RustCrypto upgrade

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-rustcrypto-upgrade.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/otp/mod.rs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rustcrypto-upgrade
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'ORESoftware/3FA-desktop.rs' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/rustcrypto-0.11-0.13')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout writable combined branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rustcrypto-0.11-0.13
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply the compatible digest-family upgrade together
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('Cargo.toml')
          text = manifest.read_text()
          before = 'hmac = "0.12"\nsha1 = "0.10"\nsha2 = "0.10"'
          after = 'hmac = "0.13"\nsha1 = "0.11"\nsha2 = "0.11"'
          if before in text:
              if text.count(before) != 1:
                  raise SystemExit('ambiguous RustCrypto dependency block')
              text = text.replace(before, after)
          elif text.count(after) != 1:
              raise SystemExit('missing reconciled RustCrypto dependency block')
          manifest.write_text(text)

          otp = Path('src/otp/mod.rs')
          source = otp.read_text()
          before_import = 'use hmac::{Hmac, Mac};'
          after_import = 'use hmac::{Hmac, KeyInit, Mac};'
          if before_import in source:
              if source.count(before_import) != 1:
                  raise SystemExit('ambiguous HMAC import')
              source = source.replace(before_import, after_import)
          elif source.count(after_import) != 1:
              raise SystemExit('missing reconciled HMAC import')
          otp.write_text(source)
          PY
          cargo update -p hmac --precise 0.13.0
          cargo update -p sha1 --precise 0.11.0
          cargo update -p sha2 --precise 0.11.0

      - name: Validate all HOTP and TOTP algorithms plus interface contracts
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo check --no-default-features
          cargo test --no-default-features
          cargo test --no-default-features --test interface_pin
          python3 scripts/check_vendored_interfaces.py
          git diff --check

      - name: Prove the OTP dependency family shares digest 0.11
        run: |
          set -euo pipefail
          cargo tree -i digest@0.11.3
          ! cargo tree -i digest@0.10.7 | grep -E '(^| )(hmac v0\.13|sha1 v0\.11|sha2 v0\.11)'
          grep -q '^hmac = "0.13"$' Cargo.toml
          grep -q '^sha1 = "0.11"$' Cargo.toml
          grep -q '^sha2 = "0.11"$' Cargo.toml
          grep -q 'use hmac::{Hmac, KeyInit, Mac};' src/otp/mod.rs

      - name: Remove one-shot workflow and commit product files
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-rustcrypto-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/apply-rustcrypto-upgrade.yml\nCargo.lock\nCargo.toml\nsrc/otp/mod.rs'
          git commit -m 'build: upgrade the OTP RustCrypto digest stack'
          git push origin HEAD:agent/rustcrypto-0.11-0.13
