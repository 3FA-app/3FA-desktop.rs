name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No build artifacts or env files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(target/|\.direnv/|\.env$|result$)' || true)
          if [ -n "$bad" ]; then echo "forbidden tracked files:"; echo "$bad"; exit 1; fi
      # The Slint GUI needs display/system deps; the core library is explicitly
      # designed to build and test headless (see Cargo.toml `gui` feature note).
      - run: cargo check --no-default-features
      - run: cargo test --no-default-features

  # The shipped app, with the GUI and networking actually compiled.
  #
  # Until now CI built ONLY `--no-default-features`, so src/ui.rs, src/sync/http.rs
  # and src/sync/supabase.rs — the code that draws the app and carries the sync
  # token — were never compiled here at all. Every transport-security test lived
  # behind `sync-net` and therefore never ran, including the one asserting
  # `localhost.evil.com` is not treated as loopback. A whole class of defect was
  # structurally invisible.
  #
  # macOS rather than Ubuntu on purpose: Slint builds on a mac runner with no
  # extra system packages, and it is a platform the app actually ships on, so
  # this job needs no speculative apt-get list to keep working. Compiling and
  # unit-testing need no display — only *running* the GUI would.
  gui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
  # src/protocol.rs must stay byte-identical to the backend's copy (the org
  # invariant guarded by PROTOCOL_VERSION). Fail loudly on any drift.
  protocol-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 3FA-app/3fa-backend.rs
          path: backend
          # If the backend repo is private, a PAT with read access is required:
          # token: ${{ secrets.THREEFA_REPO_TOKEN }}
      - run: diff -u backend/src/protocol.rs src/protocol.rs
